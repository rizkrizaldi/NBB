<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indonesia Net Bank Balance</title>
<style>
/* Net bank balance dashboard. Look follows the Danantara Markets Briefing deck:
   white pages, Georgia headlines ending in a red claim, grey commentary boxes. */
:root {
  --red: #C01E13;        /* headline red, loans and claims */
  --bright: #F90000;
  --dark: #600000;
  --salmon: #FF6262;
  --blush: #F9CBC8;
  --blue: #5A8AC6;       /* deposits and liabilities */
  --sky: #99B6DC;
  --navy: #051C2C;
  --amber: #FBAE40;
  --ink: #0b0b0b;
  --text: #2a2a2a;
  --muted: #5d5d5d;
  --grey: #E1E1E1;       /* commentary boxes */
  --rule: #d6d6d6;
  --grid: #ececec;
  --page: #f3f2f0;
  --serif: Georgia, "Times New Roman", serif;
  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 104px; }
body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--red); }

/* ---- top bar ---------------------------------------------------------- */
.topbar { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--rule); }
.bar-row { display: flex; align-items: center; gap: 16px; padding: 8px 24px 6px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 700 17px/1 var(--serif); color: var(--red); white-space: nowrap; }
.controls { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ctl select { font: 600 12px var(--sans); color: var(--ink); padding: 4px 6px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; }
.seg { gap: 0; }
.seg button { font: 600 12px var(--sans); color: var(--muted); background: #fff; border: 1px solid var(--rule); padding: 5px 10px; cursor: pointer; margin-left: -1px; }
.seg button:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
.seg button:last-child { border-radius: 0 3px 3px 0; }
.seg button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; position: relative; }
.share input { width: 96px; accent-color: var(--red); }
.share output { font: 700 12px var(--sans); color: var(--ink); min-width: 34px; }
.pages { display: flex; gap: 2px; padding: 0 20px; overflow-x: auto; scrollbar-width: thin; }
.pages a { flex: none; padding: 6px 9px 7px; font: 600 12px var(--sans); color: var(--muted); text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; }
.pages a:hover { color: var(--ink); }
.pages a.on { color: var(--red); border-bottom-color: var(--red); }

/* ---- pages ------------------------------------------------------------ */
main { max-width: 1360px; margin: 0 auto; padding: 18px 16px 60px; }
.slide { position: relative; background: #fff; border: 1px solid #e3e2df; box-shadow: 0 1px 3px rgba(0,0,0,.05); padding: 22px 28px 14px; margin: 0 0 18px; }
.headline { margin: 0 0 12px; font: 700 26px/1.2 var(--serif); color: var(--ink); letter-spacing: -.2px; text-wrap: balance; }
.headline .claim { color: var(--red); }
.strap { background: var(--grey); padding: 9px 14px; margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: var(--ink); }
.strap b, .note b { font-weight: 700; }
.body { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
.body.wide { grid-template-columns: minmax(0, 1fr); }
.note { background: var(--grey); padding: 14px 14px 6px; font-size: 13px; line-height: 1.45; color: var(--ink); align-self: stretch; }
.note ul { margin: 0; padding: 0 0 0 16px; }
.note li { margin: 0 0 12px; }
.note .warn { color: var(--red); }
.panels { display: grid; gap: 18px 24px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.panels.one { grid-template-columns: minmax(0, 1fr); }
.panels.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panel { margin: 0; min-width: 0; }
.panel.span2 { grid-column: span 2; }
.panel.span3 { grid-column: 1 / -1; }
.cap { font: 700 13px/1.3 var(--serif); color: var(--ink); text-align: center; padding: 0 8px 6px; margin: 0 0 6px; border-bottom: 1.5px solid var(--red); min-height: 40px; display: flex; align-items: flex-end; justify-content: center; text-wrap: balance; }
.unit { font: italic 11px var(--serif); color: var(--muted); margin: 0 0 2px; display: flex; justify-content: space-between; gap: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; margin: 2px 0 4px; font-size: 11.5px; color: var(--text); }
.legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend i { width: 11px; height: 11px; flex: none; display: inline-block; }
.legend i.line { height: 3px; }
.legend i.dash { height: 0; border-top: 2px dashed currentColor; background: none !important; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--sans); }
.chart .axis text { font-size: 10.5px; fill: var(--muted); }
.chart .grid line { stroke: var(--grid); }
.chart .zero { stroke: #8d8d8d; stroke-width: 1; }
.chart .endlab { font-size: 11px; font-weight: 700; }
.chart .barlab { font-size: 11px; fill: var(--ink); }
.chart .vallab { font-size: 11px; font-weight: 700; fill: var(--ink); }
.chart .mark line { stroke: #8d8d8d; stroke-dasharray: 3 3; }
.chart .mark text { font: italic 10.5px var(--serif); fill: var(--muted); }
.chart .hover-line { stroke: #777; stroke-width: 1; pointer-events: none; }
.source { margin: 12px 0 0; font: italic 11px var(--serif); color: var(--muted); text-align: center; }
.source b { font-weight: 700; }
.pageno { position: absolute; right: 14px; bottom: 10px; font: 10px var(--sans); color: #9a9a9a; }
.empty { padding: 30px 8px; text-align: center; color: var(--muted); font: italic 12px var(--serif); }

/* ---- cover ------------------------------------------------------------ */
.cover { padding: 0 0 26px; overflow: hidden; }
.cover .mosaic { display: block; width: 100%; height: auto; margin-top: 56px; }
.cover h1 { margin: -8px 0 0; padding: 0 6% ; font: 700 clamp(30px, 4.6vw, 56px)/1.15 var(--serif); color: var(--red); letter-spacing: -.4px; }
.cover .sub { padding: 0 6%; margin: 14px 0 0; font: 15px/1.5 var(--sans); color: var(--text); max-width: 880px; }
.cover .foot { margin: 46px 6% 0; font: 700 12px/1.5 var(--sans); color: var(--red); }
.cover .foot span { font-weight: 400; color: var(--muted); }

/* ---- tiles ------------------------------------------------------------ */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
.tile { border-top: 3px solid var(--red); background: #faf9f8; padding: 9px 11px 8px; min-width: 0; }
.tile .k { font: 700 12px/1.25 var(--serif); color: var(--ink); min-height: 30px; }
.tile .v { font: 700 25px/1.1 var(--serif); color: var(--ink); margin-top: 3px; white-space: nowrap; }
.tile .v small { font: 400 11px var(--sans); color: var(--muted); margin-left: 3px; }
.tile .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.tile .d b.up { color: var(--red); } .tile .d b.down { color: var(--blue); }
.tile .role { font: italic 11px var(--serif); color: var(--muted); }
.tile svg { display: block; width: 100%; height: 30px; margin-top: 4px; }

/* ---- tables ----------------------------------------------------------- */
table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
table.data th { font: 700 11.5px var(--serif); text-align: right; padding: 5px 8px; border-bottom: 1.5px solid var(--red); vertical-align: bottom; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
table.data tr.total td { font-weight: 700; border-top: 1px solid #999; }
table.data td.pos { color: var(--red); } table.data td.neg { color: #2f5f9e; }
table.data td .sw { display: inline-block; width: 9px; height: 9px; margin-right: 6px; }
.tablewrap { overflow-x: auto; }
.badge { display: inline-block; font: 700 11px var(--sans); padding: 2px 7px; border-radius: 2px; background: #e9f3ea; color: #1c6b2a; }
.badge.bad { background: #fde9e7; color: var(--red); }
.defs { columns: 2; column-gap: 28px; font-size: 12.5px; }
.defs p { margin: 0 0 9px; break-inside: avoid; }

/* ---- explorer --------------------------------------------------------- */
.explorer { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; }
.picker { border: 1px solid var(--rule); display: flex; flex-direction: column; max-height: 520px; }
.picker input[type=search] { border: 0; border-bottom: 1px solid var(--rule); padding: 8px 10px; font: 13px var(--sans); outline-offset: -2px; }
.picker .list { overflow: auto; padding: 4px 0; }
.picker .grp { font: 700 11.5px var(--serif); padding: 7px 10px 3px; color: var(--red); }
.picker label { display: flex; gap: 7px; padding: 2px 10px; font-size: 12px; cursor: pointer; align-items: baseline; }
.picker label:hover { background: #f6f5f3; }
.picker input[type=checkbox] { accent-color: var(--red); flex: none; }
.xbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; }
.btn { font: 600 12px var(--sans); color: #fff; background: var(--red); border: 0; padding: 6px 12px; border-radius: 3px; cursor: pointer; }
.btn.ghost { color: var(--red); background: #fff; border: 1px solid var(--red); }

/* ---- tooltip ---------------------------------------------------------- */
.tip { position: fixed; z-index: 50; pointer-events: none; background: #fff; border: 1px solid #bdbdbd; box-shadow: 0 3px 10px rgba(0,0,0,.14); padding: 7px 9px; font-size: 12px; line-height: 1.4; max-width: 320px; }
.tip .t { font: 700 12px var(--serif); margin-bottom: 3px; color: var(--ink); }
.tip .r { display: flex; justify-content: space-between; gap: 14px; white-space: nowrap; }
.tip .r i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .tot { border-top: 1px solid var(--rule); margin-top: 3px; padding-top: 3px; }

/* ---- small screens ---------------------------------------------------- */
@media (max-width: 1080px) {
  .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .body { grid-template-columns: minmax(0, 1fr); }
  .panels.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .explorer { grid-template-columns: minmax(0, 1fr); }
  .picker { max-height: 260px; }
}
@media (max-width: 720px) {
  html { scroll-padding-top: 8px; }
  .topbar { position: static; }   /* four rows of controls are too much to pin on a phone */
  main { padding: 10px 8px 40px; }
  .slide { padding: 16px 14px 12px; }
  .bar-row { padding: 8px 12px 4px; gap: 8px; }
  .controls { margin-left: 0; gap: 8px; }
  .pages { padding: 0 8px; }
  .headline { font-size: 20px; }
  .panels, .panels.three { grid-template-columns: minmax(0, 1fr); }
  .panel.span2 { grid-column: auto; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .defs { columns: 1; }
  .cap { min-height: 0; }
}

/* ---- print: one page per sheet --------------------------------------- */
@media print {
  @page { size: A4 landscape; margin: 9mm; }
  body { background: #fff; }
  .topbar, .tip, .picker, .xbar { display: none !important; }
  main { max-width: none; padding: 0; }
  .slide { border: 0; box-shadow: none; margin: 0; break-after: page; break-inside: avoid; padding: 0; }
  .explorer { grid-template-columns: minmax(0, 1fr); }
}

</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="bar-row">
    <a class="brand" href="#cover" aria-label="Back to cover">
      <svg viewBox="0 0 54 24" width="54" height="24" aria-hidden="true">
        <rect x="0" y="2" width="16" height="7" fill="#F90000"/><rect x="16" y="9" width="9" height="7" fill="#600000"/>
        <rect x="25" y="2" width="13" height="7" fill="#C01E13"/><rect x="38" y="9" width="16" height="7" fill="#F90000"/>
        <rect x="42" y="16" width="6" height="6" fill="#C01E13"/><rect x="48" y="16" width="6" height="6" fill="#600000"/>
      </svg>
      <span>Net Bank Balance</span>
    </a>
    <div class="controls">
      <label class="ctl">As of
        <select id="ctl-asof" aria-label="As-of month"></select>
      </label>
      <div class="ctl seg" role="group" aria-label="Time range" id="ctl-range">
        <button type="button" data-range="5">5 years</button>
        <button type="button" data-range="10">10 years</button>
        <button type="button" data-range="all">All</button>
      </div>
      <label class="ctl share" title="Share of banks' non-loan claims on the private sector assigned to firms; the rest goes to individuals">
        Securities to firms
        <input id="ctl-share" type="range" min="0" max="100" step="5" aria-label="Share of non-loan claims assigned to firms">
        <output id="ctl-share-out"></output>
      </label>
    </div>
  </div>
  <nav class="pages" id="nav" aria-label="Pages"></nav>
</header>
<main id="app"></main>
<div id="tip" class="tip" role="status" hidden></div>
<script>
