<script>
/* Model: reads the embedded data file and computes sector positions.
   All series are monthly, IDR billion, null where BI has no number.
   Sector definitions mirror bank_net_balance.py (docs/2026-11-12-net-bank-balance-design.md);
   selfCheck() confirms the two agree. */
const NBB = (() => {
  "use strict";
  const D = window.NBB_DATA;
  const dates = D.dates, N = dates.length;
  const S = key => {
    const s = D.series[key];
    if (!s) throw new Error("No series named " + key);
    return s;
  };
  const state = { asOf: N - 1, range: "all", share: D.meta.share };

  // ---- array arithmetic: a missing input gives a missing output ----------
  const zip = (fn, ...arrs) => arrs[0].map((_, i) => {
    const xs = arrs.map(a => a[i]);
    return xs.some(x => x == null) ? null : fn(...xs);
  });
  const add = (...arrs) => zip((...xs) => xs.reduce((a, b) => a + b, 0), ...arrs);
  const sub = (a, b) => zip((x, y) => x - y, a, b);
  const times = (a, k) => a.map(x => (x == null ? null : x * k));
  const ratio = (a, b) => zip((x, y) => (y === 0 ? null : 100 * x / y), a, b);
  const diff = (a, k) => a.map((x, i) => (i < k || x == null || a[i - k] == null ? null : x - a[i - k]));
  const growth = (a, k = 12) => a.map((x, i) =>
    (i < k || x == null || a[i - k] == null || a[i - k] === 0 ? null : 100 * (x / a[i - k] - 1)));

  // ---- sectors -----------------------------------------------------------
  // State in blues, firms and individuals in reds, the rest of the world in amber, non-profits
  // in slate, financial institutions and the balancing line in greys. Colours come from the
  // Danantara deck; STACK_ORDER keeps neighbours in stacked charts far enough apart to tell
  // apart, including for colour-blind readers (checked with the dataviz palette validator).
  const SECTORS = [
    { id: "bi", name: "Bank Indonesia", short: "Bank Indonesia", color: "#051C2C" },
    { id: "cg", name: "Central government", short: "Central government", color: "#5A8AC6" },
    { id: "nr", name: "Non-residents", short: "Non-residents", color: "#FBAE40" },
    { id: "lg", name: "Local governments", short: "Local governments", color: "#99B6DC" },
    { id: "ofc", name: "Other financial institutions", short: "Other financials", color: "#8E8E8E" },
    { id: "soe", name: "Non-financial SOEs", short: "SOEs", color: "#600000" },
    { id: "firms", name: "Private non-financial firms", short: "Private firms", color: "#F90000" },
    { id: "indiv", name: "Individuals", short: "Individuals", color: "#FF6262" },
    { id: "rest", name: "Foundations, cooperatives, other", short: "Foundations, co-ops", color: "#3C4B57" },
    { id: "cap", name: "Capital and other items (net)", short: "Capital and other", color: "#CFCDC8", balancing: true },
  ];
  const STACK_ORDER = ["bi", "cg", "nr", "soe", "firms", "lg", "indiv", "rest", "ofc", "cap"];
  const NINE = SECTORS.filter(s => !s.balancing);
  const byId = Object.fromEntries(SECTORS.map(s => [s.id, s]));

  let cache = { share: null, pos: null };
  function positions() {
    if (cache.share === state.share) return cache.pos;
    const share = state.share, other = S("i3.other_priv");
    const claims = {
      bi: S("i3.claims_bi"), cg: S("i3.claims_cg"), nr: S("i3.claims_nr"), lg: S("i3.claims_lg"),
      ofc: S("i3.claims_ofc"), soe: S("i3.claims_soe"),
      firms: add(S("loans.total.firms"), times(other, share)),
      indiv: add(S("loans.total.indiv"), times(other, 1 - share)),
      rest: add(S("loans.total.found"), S("loans.total.coop"), S("loans.total.oth")),
    };
    const liab = {
      bi: S("i3.liab_bi"), cg: S("i3.liab_cg"), nr: S("i3.liab_nr"), lg: S("dep.total.lg"),
      ofc: add(S("dep.total.ofc"), S("i3.liab_ofc")), soe: S("dep.total.soe"),
      firms: S("dep.total.firms"), indiv: S("dep.total.indiv"),
      rest: add(S("dep.total.found"), S("dep.total.coop"), S("dep.total.oth")),
    };
    const net = {};
    NINE.forEach(s => { net[s.id] = sub(claims[s.id], liab[s.id]); });
    net.cap = times(add(...NINE.map(s => net[s.id])), -1);
    cache = { share, pos: { claims, liab, net } };
    return cache.pos;
  }

  /** Compare the page's nets (share = 1) with the ones Python computed. */
  function selfCheck() {
    const keep = state.share;
    state.share = 1;
    const net = positions().net;
    let worst = 0, missing = 0;
    SECTORS.forEach(s => {
      const ref = D.selfcheck.net[s.name];
      net[s.id].forEach((v, i) => {
        if (v == null || ref[i] == null) { if (v !== ref[i]) missing += 1; return; }
        worst = Math.max(worst, Math.abs(v - ref[i]));
      });
    });
    state.share = keep;
    cache = { share: null, pos: null };
    // series are rounded to IDR 0.1 bn, so sums of twenty of them can differ by about 1 bn
    return { ok: worst < 2 && missing === 0, worst, missing };
  }

  // ---- window and labels ---------------------------------------------------
  function win() {
    const i1 = state.asOf;
    const i0 = state.range === "all" ? 0 : Math.max(0, i1 - 12 * Number(state.range));
    return { i0, i1 };
  }
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const MONTH = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const ym = i => dates[i].split("-").map(Number);
  const monthShort = i => { const [y, m] = ym(i); return MON[m - 1] + " " + y; };
  const monthLong = i => { const [y, m] = ym(i); return MONTH[m - 1] + " " + y; };
  const asDate = i => { const [y, m] = ym(i); return new Date(y, m - 1, 1); };
  const isProvisional = i => D.meta.provisional.includes(dates[i]);

  // ---- number formats (inputs in IDR billion unless noted) ----------------
  const MINUS = "−";
  const group = (x, d) => x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  /** IDR billion -> trillion text, e.g. 1483104 -> "1,483"; small numbers keep one decimal. */
  function tn(v, digits) {
    if (v == null || !isFinite(v)) return "n/a";
    const t = v / 1000, d = digits != null ? digits : (Math.abs(t) >= 100 ? 0 : 1);
    const s = group(Math.abs(t), d);
    return (t < 0 && Number(s.replace(/,/g, "")) !== 0 ? MINUS : "") + s;
  }
  /** Signed trillion text: "+279" or "−46". */
  function stn(v, digits) {
    if (v == null || !isFinite(v)) return "n/a";
    const s = tn(v, digits);
    return s.startsWith(MINUS) ? s : (Number(s.replace(/,/g, "")) === 0 ? s : "+" + s);
  }
  function pct(v, d = 1) {
    if (v == null || !isFinite(v)) return "n/a";
    const s = group(Math.abs(v), d);
    return (v < 0 && Number(s) !== 0 ? MINUS : "") + s + "%";
  }
  function spct(v, d = 1) {
    if (v == null || !isFinite(v)) return "n/a";
    const s = pct(v, d);
    return s.startsWith(MINUS) || Number(s.replace("%", "")) === 0 ? s : "+" + s;
  }
  /** Percentage-point change text: "+1.2 pts". */
  function pts(v, d = 1) {
    if (v == null || !isFinite(v)) return "n/a";
    const s = group(Math.abs(v), d);
    return (v < 0 && Number(s) !== 0 ? MINUS : Number(s) === 0 ? "" : "+") + s + " pts";
  }
  const at = (arr, i) => (i >= 0 && i < arr.length ? arr[i] : null);
  const change = (arr, i, k) => { const a = at(arr, i), b = at(arr, i - k); return a == null || b == null ? null : a - b; };
  const growthAt = (arr, i, k = 12) => { const a = at(arr, i), b = at(arr, i - k); return a == null || b == null || b === 0 ? null : 100 * (a / b - 1); };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  /** "A, B and C" */
  const listing = xs => (xs.length <= 1 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1]);

  return {
    D, dates, N, S, state, SECTORS, NINE, STACK_ORDER, byId, positions, selfCheck, win,
    add, sub, times, ratio, diff, growth, at, change, growthAt,
    monthShort, monthLong, asDate, isProvisional, tn, stn, pct, spct, pts, esc, listing, MINUS,
  };
})();

</script>
<script>
/* Charts: small d3 toolkit in the deck's style. Every chart takes the element to draw in
   and plain options; values are full-length monthly arrays, the window is [i0, i1]. */
const Charts = (() => {
  "use strict";
  const { asDate, monthLong, esc } = NBB;
  const tipEl = document.getElementById("tip");

  // ---- tooltip -------------------------------------------------------------
  const Tip = {
    show(evt, html) {
      tipEl.innerHTML = html;
      tipEl.hidden = false;
      const pad = 14, r = tipEl.getBoundingClientRect();
      let x = evt.clientX + pad, y = evt.clientY + pad;
      if (x + r.width > window.innerWidth - 6) x = evt.clientX - r.width - pad;
      if (y + r.height > window.innerHeight - 6) y = evt.clientY - r.height - pad;
      tipEl.style.left = Math.max(4, x) + "px";
      tipEl.style.top = Math.max(4, y) + "px";
    },
    hide() { tipEl.hidden = true; },
    rows(title, rows, total) {
      const body = rows.map(r => `<div class="r"><span><i style="background:${r.color || "transparent"}"></i>${esc(r.name)}</span><b>${esc(r.text)}</b></div>`).join("");
      const foot = total ? `<div class="r tot"><span>${esc(total.name)}</span><b>${esc(total.text)}</b></div>` : "";
      return `<div class="t">${esc(title)}</div>${body}${foot}`;
    },
  };

  function frame(el, height, margin) {
    el.innerHTML = "";
    const width = Math.max(220, Math.floor(el.getBoundingClientRect().width) || 480);
    const svg = d3.select(el).append("svg").attr("viewBox", `0 0 ${width} ${height}`).attr("height", height).attr("role", "img");
    const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
    return { svg, g, w: width - margin.left - margin.right, h: height - margin.top - margin.bottom, width };
  }

  function yAxis(g, y, w, fmt, ticks = 5) {
    const vals = y.ticks(ticks);
    const grid = g.append("g").attr("class", "grid");
    grid.selectAll("line").data(vals).join("line").attr("x1", 0).attr("x2", w).attr("y1", d => y(d)).attr("y2", d => y(d));
    const axis = g.append("g").attr("class", "axis");
    axis.selectAll("text").data(vals).join("text").attr("x", -6).attr("y", d => y(d)).attr("dy", "0.32em").attr("text-anchor", "end").text(d => fmt(d));
    const [lo, hi] = y.domain();
    if (lo < 0 && hi > 0) g.append("line").attr("class", "zero").attr("x1", 0).attr("x2", w).attr("y1", y(0)).attr("y2", y(0));
  }

  function timeAxis(g, x, h, w) {
    const years = Math.max(1, (x.domain()[1] - x.domain()[0]) / 31557600000);
    const step = Math.max(1, Math.ceil(years / Math.max(2, Math.floor(w / 56))));
    const ticks = years <= 2.5 ? x.ticks(d3.timeMonth.every(6)) : x.ticks(d3.timeYear.every(step));
    const fmt = years <= 2.5 ? d3.timeFormat("%b %y") : d3.timeFormat("%Y");
    const axis = g.append("g").attr("class", "axis").attr("transform", `translate(0,${h})`);
    axis.append("line").attr("x1", 0).attr("x2", w).attr("stroke", "#b9b9b9");
    axis.selectAll("text").data(ticks).join("text").attr("x", d => x(d)).attr("y", 15).attr("text-anchor", "middle").text(d => fmt(d));
  }

  function drawMarks(g, x, h, marks, i0, i1) {
    (marks || []).filter(m => m.i > i0 && m.i <= i1).forEach((m, k) => {
      const mg = g.append("g").attr("class", "mark");
      mg.append("line").attr("x1", x(asDate(m.i))).attr("x2", x(asDate(m.i))).attr("y1", 0).attr("y2", h);
      mg.append("text").attr("x", x(asDate(m.i)) + 3).attr("y", -5 - 11 * (k % 2)).attr("text-anchor", "end").text(m.text);
    });
  }

  /** Push label positions apart so they do not overlap (positions in pixels). */
  function spread(items, gap, lo, hi) {
    const sorted = items.slice().sort((a, b) => a.y - b.y);
    for (let i = 1; i < sorted.length; i++) if (sorted[i].y - sorted[i - 1].y < gap) sorted[i].y = sorted[i - 1].y + gap;
    const over = sorted.length ? sorted[sorted.length - 1].y - hi : 0;
    if (over > 0) sorted.forEach(s => { s.y -= over; });
    for (let i = sorted.length - 2; i >= 0; i--) if (sorted[i + 1].y - sorted[i].y < gap) sorted[i].y = sorted[i + 1].y - gap;
    sorted.forEach(s => { s.y = Math.max(lo, s.y); });
    return sorted;
  }

  /** A colour dark enough to read as small text: light series colours are deepened. */
  const ink = c => { const h = d3.hcl(c); if (h.l > 58) h.l = 46; return h.formatHex(); };
  const lastValue = (values, i0, i1) => { for (let i = i1; i >= i0; i--) if (values[i] != null) return { i, v: values[i] }; return null; };

  // ---- line chart ------------------------------------------------------------
  /** o: {i0, i1, series:[{name,color,values,dash,width}], fmt, axisFmt, height, baseline, marks, endLabels} */
  function line(el, o) {
    const series = o.series.filter(s => lastValue(s.values, o.i0, o.i1));
    if (!series.length) { el.innerHTML = '<div class="empty">No data in this period</div>'; return; }
    const endLabels = o.endLabels !== false;
    const m = { top: o.marks ? 28 : 8, right: endLabels ? 52 : 10, bottom: 22, left: 46 };
    const f = frame(el, o.height || 230, m);
    const first = d3.min(series, s => { for (let i = o.i0; i <= o.i1; i++) if (s.values[i] != null) return i; return o.i1; });
    const x = d3.scaleTime().domain([asDate(first), asDate(o.i1)]).range([0, f.w]);
    const all = [];
    series.forEach(s => { for (let i = first; i <= o.i1; i++) if (s.values[i] != null) all.push(s.values[i]); });
    let lo = d3.min(all), hi = d3.max(all);
    if (o.baseline) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (lo === hi) { lo -= 1; hi += 1; }
    const padY = (hi - lo) * 0.07;
    const y = d3.scaleLinear().domain([lo - (o.baseline && lo === 0 ? 0 : padY), hi + padY]).range([f.h, 0]).nice(5);
    yAxis(f.g, y, f.w, o.axisFmt || o.fmt);
    timeAxis(f.g, x, f.h, f.w);
    drawMarks(f.g, x, f.h, o.marks, first, o.i1);
    const idx = d3.range(first, o.i1 + 1);
    const path = d3.line().defined(i => i.v != null).x(i => x(asDate(i.i))).y(i => y(i.v));
    series.forEach(s => {
      f.g.append("path").attr("d", path(idx.map(i => ({ i, v: s.values[i] })))).attr("fill", "none")
        .attr("stroke", s.color).attr("stroke-width", s.width || 2).attr("stroke-linejoin", "round")
        .attr("stroke-dasharray", s.dash ? "5 3" : null);
    });
    if (endLabels) {
      const labs = series.map(s => { const e = lastValue(s.values, first, o.i1); return { s, e, y: y(e.v) }; });
      spread(labs, 12, 4, f.h - 2).forEach(l => {
        f.g.append("circle").attr("cx", x(asDate(l.e.i))).attr("cy", y(l.e.v)).attr("r", 3).attr("fill", l.s.color).attr("stroke", "#fff").attr("stroke-width", 1);
        f.g.append("text").attr("class", "endlab").attr("x", f.w + 7).attr("y", l.y).attr("dy", "0.32em").attr("fill", ink(l.s.color)).text(o.fmt(l.e.v));
      });
    }
    const hover = f.g.append("line").attr("class", "hover-line").attr("y1", 0).attr("y2", f.h).style("display", "none");
    f.g.append("rect").attr("width", f.w).attr("height", f.h).attr("fill", "transparent")
      .on("mousemove", evt => {
        const [px] = d3.pointer(evt);
        const t = x.invert(px);
        const i = Math.max(first, Math.min(o.i1, first + Math.round((t - asDate(first)) / 2629800000)));
        hover.style("display", null).attr("x1", x(asDate(i))).attr("x2", x(asDate(i)));
        Tip.show(evt, Tip.rows(monthLong(i), series.filter(s => s.values[i] != null).map(s => ({ name: s.name, color: s.color, text: o.fmt(s.values[i]) }))));
      })
      .on("mouseleave", () => { hover.style("display", "none"); Tip.hide(); });
  }

  // ---- stacked columns (positives up, negatives down) ---------------------
  /** o: {i0, i1, series:[{name,color,values}], fmt, axisFmt, height, percent, marks, totalName} */
  function stack(el, o) {
    const m = { top: o.marks ? 28 : 8, right: 10, bottom: 22, left: 46 };
    const f = frame(el, o.height || 300, m);
    let first = o.i0;
    while (first < o.i1 && o.series.every(s => s.values[first] == null)) first += 1;
    const idx = d3.range(first, o.i1 + 1);
    const cols = idx.map(i => {
      const raw = o.series.map(s => s.values[i]);
      const base = o.percent ? d3.sum(raw, v => Math.max(0, v || 0)) : 1;
      let up = 0, down = 0;
      const parts = o.series.map((s, k) => {
        const v = raw[k] == null ? 0 : (o.percent ? (base ? 100 * raw[k] / base : 0) : raw[k]);
        const seg = v >= 0 ? { y0: up, y1: up + v } : { y0: down + v, y1: down };
        if (v >= 0) up += v; else down += v;
        return { s, v, raw: raw[k], ...seg };
      });
      return { i, parts, up, down };
    });
    const x = d3.scaleTime().domain([asDate(first), d3.timeMonth.offset(asDate(o.i1), 1)]).range([0, f.w]);
    const y = d3.scaleLinear().domain(o.percent ? [0, 100] : [d3.min(cols, c => c.down), d3.max(cols, c => c.up)]).range([f.h, 0]);
    if (!o.percent) y.nice(6);
    yAxis(f.g, y, f.w, o.axisFmt || o.fmt, 6);
    const bw = f.w / idx.length, gap = bw > 12 ? 1 : 0;
    const layer = f.g.append("g");
    cols.forEach(c => {
      const x0 = x(asDate(c.i));
      c.parts.forEach(p => {
        if (!p.v) return;
        layer.append("rect").attr("x", x0).attr("width", Math.max(0.6, bw - gap + (gap ? 0 : 0.4)))
          .attr("y", y(p.y1)).attr("height", Math.max(0, y(p.y0) - y(p.y1))).attr("fill", p.s.color);
      });
    });
    if (!o.percent && y.domain()[0] < 0) f.g.append("line").attr("class", "zero").attr("x1", 0).attr("x2", f.w).attr("y1", y(0)).attr("y2", y(0));
    timeAxis(f.g, x, f.h, f.w);
    drawMarks(f.g, x, f.h, o.marks, first, o.i1);
    const hover = f.g.append("rect").attr("y", 0).attr("height", f.h).attr("width", Math.max(1, bw)).attr("fill", "rgba(0,0,0,.08)").style("display", "none").style("pointer-events", "none");
    f.g.append("rect").attr("width", f.w).attr("height", f.h).attr("fill", "transparent")
      .on("mousemove", evt => {
        const [px] = d3.pointer(evt);
        const k = Math.max(0, Math.min(cols.length - 1, Math.floor(px / bw)));
        const c = cols[k];
        hover.style("display", null).attr("x", x(asDate(c.i)));
        const rows = c.parts.filter(p => p.raw != null).map(p => ({ name: p.s.name, color: p.s.color, text: o.percent ? NBB.pct(p.v) : o.fmt(p.raw) }));
        Tip.show(evt, Tip.rows(monthLong(c.i), rows, o.totalName ? { name: o.totalName, text: o.fmt(d3.sum(c.parts, p => p.raw || 0)) } : null));
      })
      .on("mouseleave", () => { hover.style("display", "none"); Tip.hide(); });
  }

  // ---- horizontal bars around zero ------------------------------------------
  /** o: {items:[{label,value,color,note}], fmt, rowH, labelW} */
  function hbar(el, o) {
    const items = o.items.filter(d => d.value != null);
    if (!items.length) { el.innerHTML = '<div class="empty">No data</div>'; return; }
    const rowH = o.rowH || 25;
    const width = Math.floor(el.getBoundingClientRect().width) || 480;
    const need = d3.max(items, d => d.label.length) * 6.3 + 10, room0 = Math.round(width * 0.42);
    // on a narrow chart the long names would be cut off: fall back to the short ones
    const name = d => (need > room0 && d.short ? d.short : d.label);
    const labelW = o.labelW || Math.min(room0, Math.max(90, d3.max(items, d => name(d).length) * 6.3 + 10));
    const m = { top: 4, right: 8, bottom: 4, left: labelW };
    const f = frame(el, items.length * rowH + m.top + m.bottom, m);
    const lo = Math.min(0, d3.min(items, d => d.value)), hi = Math.max(0, d3.max(items, d => d.value));
    const room = 46; // space for value labels at the bar ends
    const x = d3.scaleLinear().domain([lo, hi === lo ? lo + 1 : hi]).range([lo < 0 ? room : 0, f.w - (hi > 0 ? room : 0)]);
    f.g.append("line").attr("class", "zero").attr("x1", x(0)).attr("x2", x(0)).attr("y1", 0).attr("y2", f.h);
    items.forEach((d, k) => {
      const yy = k * rowH, x0 = x(Math.min(0, d.value)), x1 = x(Math.max(0, d.value));
      f.g.append("text").attr("class", "barlab").attr("x", -8).attr("y", yy + rowH / 2).attr("dy", "0.32em").attr("text-anchor", "end").text(name(d));
      f.g.append("rect").attr("x", x0).attr("y", yy + 4).attr("width", Math.max(1, x1 - x0)).attr("height", rowH - 8).attr("fill", d.color)
        .on("mousemove", evt => Tip.show(evt, Tip.rows(d.label, [{ name: d.note || o.valueName || "Value", color: d.color, text: o.fmt(d.value) }])))
        .on("mouseleave", Tip.hide);
      f.g.append("text").attr("class", "vallab").attr("y", yy + rowH / 2).attr("dy", "0.32em")
        .attr("x", d.value >= 0 ? x1 + 5 : x0 - 5).attr("text-anchor", d.value >= 0 ? "start" : "end").text(o.fmt(d.value));
    });
  }

  // ---- two-sided bars: left and right of a centre label column -----------
  /** o: {items:[{label,left,right}], leftName, rightName, leftColor, rightColor, fmt, rowH} */
  function pair(el, o) {
    const items = o.items.filter(d => d.left != null || d.right != null);
    if (!items.length) { el.innerHTML = '<div class="empty">No data</div>'; return; }
    const rowH = o.rowH || 25;
    const width = Math.floor(el.getBoundingClientRect().width) || 480;
    const mid = Math.min(Math.round(width * 0.36), Math.max(110, d3.max(items, d => d.label.length) * 6.2 + 16));
    const m = { top: 18, right: 4, bottom: 4, left: 4 };
    const f = frame(el, items.length * rowH + m.top + m.bottom, m);
    const side = (f.w - mid) / 2, room = 44;
    const max = d3.max(items, d => Math.max(d.left || 0, d.right || 0)) || 1;
    const sx = d3.scaleLinear().domain([0, max]).range([0, Math.max(10, side - room)]);
    f.g.append("text").attr("class", "barlab").attr("x", side).attr("y", -6).attr("text-anchor", "end").attr("font-weight", 700).attr("fill", o.leftColor).text(o.leftName);
    f.g.append("text").attr("class", "barlab").attr("x", side + mid).attr("y", -6).attr("font-weight", 700).attr("fill", o.rightColor).text(o.rightName);
    items.forEach((d, k) => {
      const yy = k * rowH, cy = yy + rowH / 2;
      f.g.append("text").attr("class", "barlab").attr("x", side + mid / 2).attr("y", cy).attr("dy", "0.32em").attr("text-anchor", "middle").text(d.label);
      const draw = (v, color, name, dir) => {
        if (v == null) return;
        const wBar = Math.max(1, sx(Math.max(0, v))), x0 = dir < 0 ? side - wBar : side + mid;
        f.g.append("rect").attr("x", x0).attr("y", yy + 4).attr("width", wBar).attr("height", rowH - 8).attr("fill", color)
          .on("mousemove", evt => Tip.show(evt, Tip.rows(d.label, [{ name, color, text: o.fmt(v) }])))
          .on("mouseleave", Tip.hide);
        f.g.append("text").attr("class", "vallab").attr("y", cy).attr("dy", "0.32em")
          .attr("x", dir < 0 ? x0 - 5 : x0 + wBar + 5).attr("text-anchor", dir < 0 ? "end" : "start").text(o.fmt(v));
      };
      draw(d.left, o.leftColor, o.leftName, -1);
      draw(d.right, o.rightColor, o.rightName, 1);
    });
  }

  // ---- one line per year across the twelve months -------------------------
  /** o: {years:[{name,color,width,values:[12]}], fmt, axisFmt, height} */
  function season(el, o) {
    const years = o.years.filter(yv => yv.values.some(v => v != null));
    if (!years.length) { el.innerHTML = '<div class="empty">No data</div>'; return; }
    const m = { top: 8, right: 44, bottom: 22, left: 46 };
    const f = frame(el, o.height || 230, m);
    const names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const x = d3.scalePoint().domain(d3.range(12)).range([0, f.w]);
    const all = years.flatMap(yv => yv.values.filter(v => v != null));
    const y = d3.scaleLinear().domain([Math.min(0, d3.min(all)), d3.max(all) * 1.06]).range([f.h, 0]).nice(5);
    yAxis(f.g, y, f.w, o.axisFmt || o.fmt);
    const axis = f.g.append("g").attr("class", "axis").attr("transform", `translate(0,${f.h})`);
    axis.append("line").attr("x1", 0).attr("x2", f.w).attr("stroke", "#b9b9b9");
    axis.selectAll("text").data(d3.range(12)).join("text").attr("x", d => x(d)).attr("y", 15).attr("text-anchor", "middle").text(d => names[d]);
    const path = d3.line().defined(d => d.v != null).x(d => x(d.m)).y(d => y(d.v));
    const labs = [];
    years.forEach(yv => {
      f.g.append("path").attr("d", path(yv.values.map((v, mth) => ({ m: mth, v })))).attr("fill", "none").attr("stroke", yv.color).attr("stroke-width", yv.width || 1.5);
      let last = -1;
      yv.values.forEach((v, mth) => { if (v != null) last = mth; });
      if (yv.label !== false) labs.push({ yv, m: last, y: y(yv.values[last]) });
      if (yv.width > 2) f.g.append("circle").attr("cx", x(last)).attr("cy", y(yv.values[last])).attr("r", 3.2).attr("fill", yv.color);
    });
    spread(labs, 12, 4, f.h - 2).forEach(l => {
      f.g.append("text").attr("class", "endlab").attr("x", x(l.m) + 7).attr("y", l.y).attr("dy", "0.32em").attr("fill", ink(l.yv.color)).text(l.yv.name);
    });
    f.g.append("rect").attr("width", f.w).attr("height", f.h).attr("fill", "transparent")
      .on("mousemove", evt => {
        const [px] = d3.pointer(evt);
        const mth = Math.max(0, Math.min(11, Math.round(px / (f.w / 11))));
        Tip.show(evt, Tip.rows(names[mth], years.filter(yv => yv.values[mth] != null).map(yv => ({ name: yv.name, color: yv.color, text: o.fmt(yv.values[mth]) }))));
      })
      .on("mouseleave", Tip.hide);
  }

  /** Tiny trend line for a tile. */
  function spark(svg, values, color) {
    const pts = values.map((v, i) => ({ i, v })).filter(p => p.v != null);
    if (pts.length < 2) return;
    const w = 120, h = 30;
    const x = d3.scaleLinear().domain([pts[0].i, pts[pts.length - 1].i]).range([2, w - 4]);
    const lo = d3.min(pts, p => p.v), hi = d3.max(pts, p => p.v);
    const y = d3.scaleLinear().domain(lo === hi ? [lo - 1, hi + 1] : [lo, hi]).range([h - 3, 3]);
    const s = d3.select(svg).attr("viewBox", `0 0 ${w} ${h}`).attr("preserveAspectRatio", "none");
    if (lo < 0 && hi > 0) s.append("line").attr("x1", 0).attr("x2", w).attr("y1", y(0)).attr("y2", y(0)).attr("stroke", "#bbb").attr("stroke-dasharray", "2 2").attr("vector-effect", "non-scaling-stroke");
    s.append("path").attr("d", d3.line().x(p => x(p.i)).y(p => y(p.v))(pts)).attr("fill", "none").attr("stroke", color).attr("stroke-width", 1.6).attr("vector-effect", "non-scaling-stroke");
  }

  return { line, stack, hbar, pair, season, spark, Tip };
})();

</script>
<script>
/* App: controls and the pages. Every headline and bullet is a template filled from the
   data for the chosen as-of month; a rule decides the wording, so the text cannot drift
   from the numbers. */
const App = (() => {
  "use strict";
  const { D, dates, N, S, state, SECTORS, NINE, byId, positions, win, add, sub, times, ratio, diff, growth,
    at, change, growthAt, monthShort, monthLong, isProvisional, tn, stn, pct, spct, pts, esc, listing } = NBB;
  const RED = "#C01E13", BLUE = "#5A8AC6", INK = "#111111", NAVY = "#051C2C", SKY = "#99B6DC", AMBER = "#FBAE40",
    SALMON = "#FF6262", DARK = "#600000", GREY = "#8E8E8E";
  const app = document.getElementById("app");
  const SRC = "Bank Indonesia (SEKI tables I.3, I.11, I.18)";
  const PHRASE = { bi: "Bank Indonesia", cg: "the central government", nr: "non-residents", lg: "local governments",
    ofc: "other financial institutions", soe: "SOEs", firms: "private firms", indiv: "individuals", rest: "foundations and cooperatives" };
  const BANKS = [
    { id: "persero", name: "State-owned (Persero)", color: RED },
    { id: "private", name: "Private national", color: NAVY },
    { id: "foreign", name: "Foreign", color: BLUE },
    { id: "bpd", name: "Regional (BPD)", color: AMBER },
    { id: "rural", name: "Rural (BPR)", color: GREY },
  ];
  const PAGES = [
    ["glance", "At a glance"], ["time", "Over time"], ["sides", "Both sides"], ["bi", "Bank Indonesia"], ["gov", "Government"],
    ["nr", "Non-residents"], ["firms", "Firms and SOEs"], ["hh", "Households"], ["ofc", "Other financials"], ["fx", "Currency"],
    ["mix", "Funding mix"], ["groups", "Bank groups"], ["checks", "Checks and method"], ["explorer", "Explorer"],
  ];
  let draws = [], seq = 0, selfcheck = null;
  const explorer = { keys: ["net.bi", "net.cg", "net.firms", "net.indiv"], mode: "level", query: "" };

  // ---- small builders --------------------------------------------------------
  const idr = v => `IDR ${tn(Math.abs(v))} tn`;
  const fT = v => tn(v);
  const fP = v => pct(v, 1);
  const fP0 = v => pct(v, 0);
  const L = (name, values, color, extra) => ({ name, values, color, ...(extra || {}) });
  const leg = series => series.map(s => ({ name: s.name, color: s.color, kind: s.dash ? "dash" : "line" }));
  const idx = (y, m) => dates.indexOf(`${y}-${String(m).padStart(2, "0")}`);
  const sum = xs => xs.reduce((a, b) => a + b, 0);
  const word = (v, pos, neg) => (v >= 0 ? pos : neg);
  const marks = () => D.breaks.map(b => ({ i: dates.indexOf(b.date), text: b.detected ? "group shift" : "BI regrouping" }));

  function panel(o) {
    const id = "c" + (++seq);
    draws.push(() => o.draw(document.getElementById(id)));
    const legend = o.legend ? `<div class="legend">${o.legend.map(l =>
      `<span><i class="${l.kind || ""}" style="background:${l.color};color:${l.color}"></i>${esc(l.name)}</span>`).join("")}</div>` : "";
    return `<figure class="panel ${o.cls || ""}"><figcaption class="cap">${o.cap}</figcaption>` +
      `<div class="unit"><span>${o.unit || ""}</span><span>${o.unitRight || ""}</span></div>${legend}<div class="chart" id="${id}"></div></figure>`;
  }
  const lines = (cap, unit, series, opt) => panel({
    cap, unit, legend: series.length > 1 ? leg(series) : null, cls: (opt && opt.cls) || "",
    draw: el => Charts.line(el, { ...win(), series, fmt: (opt && opt.fmt) || fT, ...(opt || {}) }),
  });
  function tablePanel(cap, unit, cols, rows, cls) {
    const head = cols.map(c => `<th>${c}</th>`).join("");
    const body = rows.map(r => `<tr class="${r.cls || ""}">${r.cells.map(c => (typeof c === "object" && c !== null
      ? `<td class="${c.cls || ""}">${c.html}</td>` : `<td>${c}</td>`)).join("")}</tr>`).join("");
    return `<figure class="panel ${cls || ""}"><figcaption class="cap">${cap}</figcaption><div class="unit"><span>${unit || ""}</span></div>` +
      `<div class="tablewrap"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></figure>`;
  }
  const signed = v => ({ html: stn(v), cls: v == null ? "" : v >= 0 ? "pos" : "neg" });

  function slide(o) {
    const no = PAGES.findIndex(p => p[0] === o.id) + 1;
    const note = o.bullets ? `<aside class="note"><ul>${o.bullets.filter(Boolean).map(b => `<li>${b}</li>`).join("")}</ul></aside>` : "";
    return `<section class="slide" id="${o.id}"><h2 class="headline"><span class="lead">${o.lead}</span> <span class="claim">${o.claim}</span></h2>` +
      (o.strap ? `<div class="strap">${o.strap}</div>` : "") + (o.top || "") +
      `<div class="body ${o.bullets ? "" : "wide"}">${note}<div class="${o.panelsCls || "panels"}">${o.panels}</div></div>` +
      `<p class="source"><b>Source:</b> ${o.source || SRC}${o.footnote ? ". " + o.footnote : ""}</p><span class="pageno">${no}</span></section>`;
  }

  // ---- pages -----------------------------------------------------------------
  function cover(i) {
    const blocks = [[0, 13, 492, 88, "#F90000"], [492, 105, 258, 88, "#600000"], [750, 18, 396, 87, "#C01E13"],
      [1146, 105, 654, 88, "#F90000"], [1412, 193, 175, 87, "#C01E13"], [1587, 193, 213, 87, "#600000"]];
    const built = new Date(D.meta.snapshot + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    return `<section class="slide cover" id="cover"><svg class="mosaic" viewBox="0 0 1800 290" aria-hidden="true">` +
      blocks.map(b => `<rect x="${b[0]}" y="${b[1]}" width="${b[2]}" height="${b[3]}" fill="${b[4]}"/>`).join("") + `</svg>` +
      `<h1>Indonesia Net Bank Balance<br>${monthLong(i)}</h1>` +
      `<p class="sub">Who the banking system lends to, and who funds it. Positions of commercial and rural banks against each ` +
      `counterpart sector: what banks are owed, what they owe, and the difference, month by month since ${monthLong(0)}.</p>` +
      `<p class="foot">Source: Bank Indonesia, SEKI tables I.3, I.4, I.11, I.17 and I.18 &middot; data pulled ${built}` +
      (isProvisional(i) ? ` &middot; <span>${monthLong(i)} is provisional in BI's balance-sheet table</span>` : "") + `</p></section>`;
  }

  function glance(i, P) {
    const net = P.net, v = id => at(net[id], i);
    const groups = [
      { k: "State: BI, central and local government", arr: add(net.bi, net.cg, net.lg), color: NAVY },
      { k: "Firms: private and SOEs", arr: add(net.firms, net.soe), color: RED },
      { k: "Households and non-profits", arr: add(net.indiv, net.rest), color: SALMON },
      { k: "Non-residents", arr: net.nr, color: AMBER },
      { k: "Other financial institutions", arr: net.ofc, color: GREY },
      { k: "Banks' capital and other items", arr: net.cap, color: "#9b9891", own: true },
    ];
    const { i0 } = win();
    const tiles = groups.map((g, k) => {
      const now = at(g.arr, i), d12 = change(g.arr, i, 12), id = "sp" + k;
      draws.push(() => Charts.spark(document.getElementById(id), g.arr.slice(i0, i + 1), g.color));
      const role = g.own ? "funds the positions (shown negative)" : now >= 0 ? "banks are net lenders" : "net source of funds";
      return `<div class="tile" style="border-top-color:${g.color}"><div class="k">${g.k}</div><div class="v">${stn(now)}<small>IDR tn</small></div>` +
        `<div class="role">${role}</div><div class="d">12 months: <b class="${d12 >= 0 ? "up" : "down"}">${stn(d12)}</b></div><svg id="${id}"></svg></div>`;
    }).join("");
    const ranked = NINE.map(s => ({ s, v: v(s.id) })).filter(d => d.v != null).sort((a, b) => b.v - a.v);
    const lenders = ranked.filter(d => d.v > 0).slice(0, 2).map(d => PHRASE[d.s.id]);
    const funders = ranked.filter(d => d.v < 0).slice(-2).reverse().map(d => PHRASE[d.s.id]);
    const moves = NINE.map(s => ({ s, d: change(net[s.id], i, 12) })).filter(m => m.d != null).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    const state_ = at(groups[0].arr, i), hh = at(groups[2].arr, i), firms = at(groups[1].arr, i);
    const mostNegative = Math.min(...groups.slice(0, 5).map(g => at(g.arr, i)));
    return slide({
      id: "glance", lead: `Net bank balance, ${monthLong(i)}:`,
      claim: `banks' largest net claims are on ${listing(lenders)}, funded mainly by ${listing(funders)}`,
      top: `<div class="tiles">${tiles}</div>`,
      bullets: [
        `The state accounts for a net <b>${stn(state_)} tn</b>: Bank Indonesia ${stn(v("bi"))}, central government ${stn(v("cg"))}, local governments ${stn(v("lg"))}.`,
        `Households and non-profits ${hh < 0 ? (hh === mostNegative ? "are <b>the largest source of funds</b>" : "are a net source of funds") : "are net borrowers"}: individuals ${stn(v("indiv"))}, foundations and cooperatives ${stn(v("rest"))}.`,
        `Firms ${word(firms, "<b>borrow more than they deposit</b>", "<b>deposit more than they borrow</b>")}: private firms ${stn(v("firms"))}, SOEs ${stn(v("soe"))}.`,
        moves.length >= 2 ? `Over 12 months the biggest shifts were <b>${PHRASE[moves[0].s.id]}</b> (${stn(moves[0].d)}) and <b>${PHRASE[moves[1].s.id]}</b> (${stn(moves[1].d)}).` : null,
        isProvisional(i) ? `<span class="warn"><b>${monthLong(i)} is provisional</b> in BI's balance-sheet table and may be revised. Use "As of" above to step back a month.</span>` : null,
      ],
      panels:
        panel({ cap: "Banks' net position on each counterpart", unit: "IDR tn; right of zero = banks are net lenders",
          draw: el => Charts.hbar(el, { fmt: stn, valueName: "Net position, IDR tn", items: SECTORS.map(s => ({ label: s.name, short: s.short, value: v(s.id), color: s.color })) }) }) +
        panel({ cap: "Change in the net position over 12 months", unit: "IDR tn",
          draw: el => Charts.hbar(el, { fmt: stn, valueName: "12-month change, IDR tn", items: SECTORS.map(s => ({ label: s.name, short: s.short, value: change(net[s.id], i, 12), color: s.color })) }) }),
      footnote: "Net = banks' claims minus banks' liabilities to the sector; the ten lines sum to zero",
    });
  }

  function overTime(i, P) {
    const net = P.net, { i0 } = win();
    const since = NINE.map(s => ({ s, d: change(net[s.id], i, i - i0) })).filter(m => m.d != null).sort((a, b) => b.d - a.d);
    const up = since[0], down = since[since.length - 1];
    const grp = [
      L("State (BI, central and local government)", add(net.bi, net.cg, net.lg), NAVY),
      L("Firms (private and SOEs)", add(net.firms, net.soe), RED),
      L("Households and non-profits", add(net.indiv, net.rest), SALMON),
      L("Non-residents", net.nr, AMBER),
      L("Other financial institutions", net.ofc, GREY),
    ];
    const stackSeries = NBB.STACK_ORDER.map(id => L(byId[id].name, net[id], byId[id].color));
    const d = k => stn(change(grp[k].values, i, i - i0));
    return slide({
      id: "time", lead: `Since ${monthShort(i0)}:`,
      claim: `banks' net position on ${PHRASE[up.s.id]} rose by ${idr(up.d)}; on ${PHRASE[down.s.id]} it fell by ${idr(down.d)}`,
      bullets: [
        `Each column sums to zero: what banks lend net to some sectors is funded net by others and by their own capital.`,
        `<b>State</b> (BI, central and local government): ${d(0)} since ${monthShort(i0)}, to ${stn(at(grp[0].values, i))}.`,
        `<b>Firms</b>: ${d(1)}, to ${stn(at(grp[1].values, i))}. <b>Households and non-profits</b>: ${d(2)}, to ${stn(at(grp[2].values, i))}.`,
        `<b>Non-residents</b>: ${d(3)}, to ${stn(at(grp[3].values, i))}.`,
        `Capital and other items are ${stn(at(net.cap, i))}: shown negative because they fund the positions above zero.`,
      ],
      panels:
        panel({ cap: "Net position by counterpart: above zero banks are net lenders, below zero the sector funds banks", unit: "IDR tn", cls: "span2",
          legend: stackSeries.map(s => ({ name: s.name, color: s.color })),
          draw: el => Charts.stack(el, { ...win(), series: stackSeries, fmt: stn, axisFmt: fT, height: 330 }) }) +
        lines("The same positions in five groups", "IDR tn", grp, { fmt: stn, axisFmt: fT, baseline: true, height: 250 }) +
        panel({ cap: `Change in the net position since ${monthShort(i0)}`, unit: "IDR tn",
          draw: el => Charts.hbar(el, { fmt: stn, valueName: "Change, IDR tn", items: SECTORS.map(s => ({ label: s.name, short: s.short, value: change(net[s.id], i, i - i0), color: s.color })) }) }),
    });
  }

  function bothSides(i, P) {
    const c = id => at(P.claims[id], i), l = id => at(P.liab[id], i);
    const totC = sum(NINE.map(s => c(s.id))), totL = sum(NINE.map(s => l(s.id)));
    const byC = NINE.slice().sort((a, b) => c(b.id) - c(a.id)), byL = NINE.slice().sort((a, b) => l(b.id) - l(a.id));
    const share3 = (list, f, tot) => 100 * sum(list.slice(0, 3).map(s => f(s.id))) / tot;
    const other = at(S("i3.other_priv"), i);
    const rows = NINE.map(s => ({ cells: [
      { html: `<span class="sw" style="background:${s.color}"></span>${s.name}` }, tn(c(s.id)), pct(100 * c(s.id) / totC, 0), tn(l(s.id)), pct(100 * l(s.id) / totL, 0),
      signed(at(P.net[s.id], i)) ] }));
    rows.push({ cls: "total", cells: ["Nine counterparts", tn(totC), "100%", tn(totL), "100%", signed(totC - totL)] });
    rows.push({ cells: ["Capital and other items (net)", "", "", "", "", signed(at(P.net.cap, i))] });
    return slide({
      id: "sides", lead: "Both sides of the balance sheet:",
      claim: `claims on ${PHRASE[byC[0].id]} are ${pct(100 * c(byC[0].id) / totC, 0)} of what banks are owed, liabilities to ${PHRASE[byL[0].id]} ${pct(100 * l(byL[0].id) / totL, 0)} of what they owe`,
      bullets: [
        `Banks' claims on the nine counterparts total <b>${idr(totC)}</b>; ${listing(byC.slice(0, 3).map(s => PHRASE[s.id]))} are ${pct(share3(byC, c, totC), 0)} of that.`,
        `Liabilities to them total <b>${idr(totL)}</b>; ${listing(byL.slice(0, 3).map(s => PHRASE[s.id]))} are ${pct(share3(byL, l, totL), 0)}.`,
        `The gap of ${idr(totC - totL)} is covered by banks' capital and other items.`,
        `Banks' non-loan claims on the private sector (${idr(other)}, mostly securities) are not split by holder in BI's tables. Here <b>${pct(state.share * 100, 0)}</b> goes to firms and the rest to individuals: move "Securities to firms" to test it.`,
      ],
      panels:
        panel({ cap: "What banks owe each counterpart (left) and what they are owed (right)", unit: "IDR tn",
          draw: el => Charts.pair(el, { fmt: fT, leftName: "Liabilities", rightName: "Claims", leftColor: BLUE, rightColor: RED,
            items: NINE.map(s => ({ label: s.short, left: l(s.id), right: c(s.id) })) }) }) +
        tablePanel(`Positions in ${monthShort(i)}`, "IDR tn", ["Counterpart", "Claims", "Share", "Liabilities", "Share", "Net"], rows),
    });
  }

  function bankIndonesia(i, P) {
    const claims = S("i3.claims_bi"), liab = S("i3.liab_bi"), other = S("i3.bi_other");
    const giro = add(S("i3.bi_giro_rp"), S("i3.bi_giro_fx"));
    const deposits = add(S("i3.dep_incl"), S("i3.dep_excl"));
    const toDep = ratio(claims, deposits), secToDep = ratio(other, deposits);
    const parts = [
      L("BI securities and other claims (SRBI and similar)", other, RED),
      L("Current accounts at BI, rupiah", S("i3.bi_giro_rp"), NAVY),
      L("Current accounts at BI, foreign currency", S("i3.bi_giro_fx"), BLUE),
      L("Cash in vault", S("i3.bi_cash"), AMBER),
      L("BI overnight facility", S("i3.bi_facility"), GREY),
    ];
    return slide({
      id: "bi", lead: "Bank Indonesia:",
      claim: `banks keep ${idr(at(claims, i))} at the central bank, ${pct(100 * at(other, i) / at(claims, i), 0)} of it in BI securities`,
      bullets: [
        `Claims on BI changed by <b>${stn(change(claims, i, 12))} tn</b> over 12 months: BI securities ${stn(change(other, i, 12))}, current accounts ${stn(change(giro, i, 12))}, cash and the overnight facility ${stn(change(add(S("i3.bi_cash"), S("i3.bi_facility")), i, 12))}.`,
        `Placements at BI equal <b>${pct(at(toDep, i))}</b> of deposits, against ${pct(at(toDep, i - 12))} a year earlier.`,
        `Banks owe BI ${idr(at(liab, i))} (${stn(change(liab, i, 12))} over 12 months): this is BI's funding of banks.`,
        `Net of that, banks' position on BI is <b>${stn(at(P.net.bi, i))} tn</b>.`,
      ],
      panels:
        panel({ cap: "What banks hold at Bank Indonesia, by instrument", unit: "IDR tn", legend: parts.map(s => ({ name: s.name, color: s.color })),
          draw: el => Charts.stack(el, { ...win(), series: parts, fmt: fT, height: 260, totalName: "Claims on BI" }) }) +
        lines("Placements at BI relative to banks' deposits", "% of deposits",
          [L("All claims on BI", toDep, INK), L("BI securities and other claims", secToDep, RED)], { fmt: fP, axisFmt: fP0, height: 260 }) +
        lines("What banks owe BI, and the net position", "IDR tn",
          [L("Liabilities to BI", liab, BLUE), L("Net position on BI", P.net.bi, INK)], { baseline: true, cls: "span2", height: 220 }),
      source: "Bank Indonesia (SEKI table I.3)",
    });
  }

  function government(i, P) {
    const claims = S("i3.claims_cg"), liab = S("i3.liab_cg"), net = P.net.cg, lgDep = S("dep.total.lg");
    const totalClaims = add(...NINE.map(s => P.claims[s.id]));
    const shareClaims = ratio(claims, totalClaims);
    const [year] = dates[i].split("-").map(Number);
    const tones = [GREY, SKY, BLUE, NAVY, RED];
    const years = d3.range(year - 4, year + 1).map((y, k) => ({
      name: String(y), color: tones[k], width: y === year ? 2.8 : 1.5,
      values: d3.range(1, 13).map(m => { const j = idx(y, m); return j >= 0 && j <= i ? lgDep[j] : null; }),
    }));
    const full = years.filter(y => y.values.every(v => v != null));
    const drop = full.length ? d3.mean(full, y => 100 * (y.values[11] / d3.max(y.values) - 1)) : null;
    const n = at(net, i), d12 = change(net, i, 12);
    return slide({
      id: "gov", lead: "Government:",
      claim: n >= 0 ? `banks finance the central government with a net ${idr(n)}, ${word(d12, "up", "down")} ${idr(d12)} in a year`
        : `the central government holds a net ${idr(n)} at banks, ${word(-d12, "up", "down")} ${idr(d12)} in a year`,
      bullets: [
        `Claims on the central government (mostly government bonds) are <b>${idr(at(claims, i))}</b>, ${pct(at(shareClaims, i), 0)} of banks' claims on all counterparts.`,
        `Central-government deposits and other liabilities are ${idr(at(liab, i))}, ${stn(change(liab, i, 12))} over 12 months.`,
        `Local governments hold <b>${idr(at(lgDep, i))}</b> in deposits and owe banks only ${idr(at(S("i3.claims_lg"), i))}.` +
          (drop != null ? ` Their deposits build up through the year and are run down by December: in the last ${full.length} full years December stood on average ${pct(Math.abs(drop), 0)} below the year's peak.` : ""),
      ],
      panels:
        lines("Central government: claims, liabilities and net", "IDR tn",
          [L("Claims (mostly government bonds)", claims, RED), L("Liabilities (deposits)", liab, BLUE), L("Net", net, INK)], { baseline: true }) +
        lines("Claims on the central government as a share of banks' claims", "% of claims on all counterparts",
          [L("Share of claims", shareClaims, RED)], { fmt: fP, axisFmt: fP0 }) +
        panel({ cap: "Local-government deposits through the year", unit: "IDR tn",
          draw: el => Charts.season(el, { years, fmt: fT }) }) +
        lines("Local-government deposits: provinces, and cities and regencies", "IDR tn",
          [L("Cities and regencies", S("dep.total.lg_muni"), NAVY), L("Provinces", S("dep.total.lg_prov"), BLUE)], { baseline: true }),
    });
  }

  function nonResidents(i, P) {
    const claims = S("i3.claims_nr"), liab = S("i3.liab_nr"), net = P.net.nr;
    const depRp = S("dep.rupiah.nr_memo"), depFx = S("dep.fx.nr_memo"), dep = S("dep.total.nr_memo"), loans = S("loans.total.nr_memo");
    const n = at(net, i);
    return slide({
      id: "nr", lead: "Rest of the world:",
      claim: n >= 0 ? `banks are net creditors of non-residents by ${idr(n)}` : `banks owe non-residents a net ${idr(n)}`,
      bullets: [
        `Claims on non-residents are <b>${idr(at(claims, i))}</b> (${stn(change(claims, i, 12))} over 12 months); liabilities are <b>${idr(at(liab, i))}</b> (${stn(change(liab, i, 12))}).`,
        `The net position moved by <b>${stn(change(net, i, 12))} tn</b> in a year and ${stn(change(net, i, 1))} in the latest month.`,
        `Non-residents' deposits are ${idr(at(dep, i))}, ${pct(100 * at(depFx, i) / at(dep, i), 0)} in foreign currency; the other ${idr(at(liab, i) - at(dep, i))} of liabilities is non-deposit funding from abroad.`,
        `Loans to non-residents are small: ${idr(at(loans, i))}.`,
        `Foreign-currency amounts are reported in rupiah, so they also move with the exchange rate.`,
      ],
      panels:
        lines("Banks' claims on and liabilities to non-residents", "IDR tn",
          [L("Claims", claims, RED), L("Liabilities", liab, BLUE), L("Net", net, INK)], { baseline: true, cls: "span2", height: 250 }) +
        lines("Non-residents' deposits by currency", "IDR tn",
          [L("Foreign currency", depFx, AMBER), L("Rupiah", depRp, NAVY)], { baseline: true }) +
        lines("Net position on non-residents as a share of banks' claims", "% of claims on all counterparts",
          [L("Net position", ratio(net, add(...NINE.map(s => P.claims[s.id]))), INK)], { fmt: fP, axisFmt: fP0, baseline: true }),
    });
  }

  function firmsPage(i, P) {
    const fl = S("loans.total.firms"), fd = S("dep.total.firms"), sl = S("loans.total.soe"), sd = S("dep.total.soe");
    const n = at(P.net.firms, i), sec = at(S("i3.other_priv"), i) * state.share;
    const ldrF = ratio(fl, fd), ldrS = ratio(sl, sd);
    return slide({
      id: "firms", lead: "Firms:",
      claim: `private firms ${word(n, "owe banks", "hold at banks")} ${idr(n)} more than they ${word(n, "hold in deposits", "owe")}; loans grew ${pct(growthAt(fl, i))} in a year, deposits ${pct(growthAt(fd, i))}`,
      bullets: [
        `Private firms: loans <b>${idr(at(fl, i))}</b>, deposits <b>${idr(at(fd, i))}</b>. Loans are ${pct(at(ldrF, i), 0)} of deposits, against ${pct(at(ldrF, i - 12), 0)} a year earlier.`,
        `Banks also hold ${idr(sec)} of firms' securities and other non-loan claims (at the ${pct(state.share * 100, 0)} setting), which is counted in the net position.`,
        `SOEs: loans <b>${idr(at(sl, i))}</b> (${spct(growthAt(sl, i))} in a year), deposits <b>${idr(at(sd, i))}</b> (${spct(growthAt(sd, i))}); net position ${stn(at(P.net.soe, i))}.`,
        `Central SOEs (BUMN) hold ${idr(at(S("dep.total.soe_bumn"), i))} of the SOE deposits, regional ones (BUMD) ${idr(at(S("dep.total.soe_bumd"), i))}.`,
      ],
      panels:
        lines("Private non-financial firms", "IDR tn", [L("Loans", fl, RED), L("Deposits", fd, BLUE), L("Net position", P.net.firms, INK)], { baseline: true }) +
        lines("Non-financial SOEs", "IDR tn", [L("Loans", sl, RED), L("Deposits", sd, BLUE), L("Net position", P.net.soe, INK)], { baseline: true }) +
        lines("Growth over 12 months", "% change on a year earlier",
          [L("Private firms: loans", growth(fl), RED), L("Private firms: deposits", growth(fd), BLUE),
            L("SOEs: loans", growth(sl), DARK, { dash: true }), L("SOEs: deposits", growth(sd), NAVY, { dash: true })], { fmt: fP, axisFmt: fP0, baseline: true }) +
        lines("Loans relative to deposits", "loans as % of deposits",
          [L("Private firms", ldrF, RED), L("SOEs", ldrS, DARK)], { fmt: fP0, axisFmt: fP0 }),
      source: "Bank Indonesia (SEKI tables I.3, I.11, I.18)",
    });
  }

  function households(i, P) {
    const il = S("loans.total.indiv"), id_ = S("dep.total.indiv"), all = S("dep.total.total");
    const fxShare = ratio(S("dep.fx.indiv"), id_), n = at(P.net.indiv, i);
    const restDep = add(S("dep.total.found"), S("dep.total.coop"), S("dep.total.oth"));
    return slide({
      id: "hh", lead: "Households:",
      claim: `individuals ${word(-n, "hold", "owe")} ${idr(n)} more ${word(-n, "in deposits than they owe", "than they hold in deposits")}; deposits grew ${pct(growthAt(id_, i))} in a year, loans ${pct(growthAt(il, i))}`,
      bullets: [
        `Individuals' deposits are <b>${idr(at(id_, i))}</b>, ${pct(100 * at(id_, i) / at(all, i), 0)} of all resident deposits; their loans are <b>${idr(at(il, i))}</b>.`,
        `Loans equal ${pct(100 * at(il, i) / at(id_, i), 0)} of their deposits, against ${pct(100 * at(il, i - 12) / at(id_, i - 12), 0)} a year earlier.`,
        `${pct(at(fxShare, i))} of individuals' deposits are in foreign currency (${pct(at(fxShare, i - 12))} a year earlier).`,
        `Foundations, social bodies and cooperatives add ${idr(at(restDep, i))} of deposits (${spct(growthAt(restDep, i))} in a year) and borrow little; their net position is ${stn(at(P.net.rest, i))}.`,
      ],
      panels:
        lines("Individuals: loans, deposits and net", "IDR tn", [L("Loans", il, RED), L("Deposits", id_, BLUE), L("Net position", P.net.indiv, INK)], { baseline: true }) +
        lines("Individuals: growth over 12 months", "% change on a year earlier",
          [L("Loans", growth(il), RED), L("Deposits", growth(id_), BLUE)], { fmt: fP, axisFmt: fP0, baseline: true }) +
        lines("Share of individuals' deposits held in foreign currency", "% of their deposits", [L("Foreign-currency share", fxShare, AMBER)], { fmt: fP, axisFmt: fP0 }) +
        lines("Deposits of foundations, cooperatives and other private bodies", "IDR tn",
          [L("Foundations and social bodies", S("dep.total.found"), SALMON), L("Cooperatives", S("dep.total.coop"), DARK), L("Other", S("dep.total.oth"), GREY)], { baseline: true }),
      source: "Bank Indonesia (SEKI tables I.3, I.11, I.18)",
    });
  }

  function otherFinancials(i, P) {
    const types = [
      ["Pension funds", ["ofc_prv_pen"]], ["Insurers", ["ofc_pub_ins", "ofc_prv_ins"]],
      ["Finance and venture-capital companies", ["ofc_pub_fin", "ofc_prv_fin", "ofc_prv_vc"]],
      ["Securities firms and mutual funds", ["ofc_pub_sec", "ofc_prv_sec", "ofc_prv_mf"]], ["Other", ["ofc_pub_oth", "ofc_prv_oth"]],
    ];
    const tone = [NAVY, BLUE, RED, AMBER, GREY];
    const g = types.map(([name, nodes], k) => {
      const loans = add(...nodes.map(nd => S("loans.total." + nd))), dep = add(...nodes.map(nd => S("dep.total." + nd)));
      return { name, loans, dep, net: sub(loans, dep), color: tone[k] };
    });
    const ranked = g.filter(t => t.name !== "Other").slice().sort((a, b) => at(a.net, i) - at(b.net, i));
    const funder = ranked[0], borrower = ranked[ranked.length - 1];
    const dep = S("dep.total.ofc"), loans = S("loans.total.ofc");
    const detail = [["State-owned insurers", "ofc_pub_ins"], ["State-owned finance institutions", "ofc_pub_fin"], ["State-owned securities and funds", "ofc_pub_sec"],
      ["State-owned, other", "ofc_pub_oth"], ["Private insurers", "ofc_prv_ins"], ["Pension funds", "ofc_prv_pen"], ["Finance companies", "ofc_prv_fin"],
      ["Venture capital", "ofc_prv_vc"], ["Securities companies", "ofc_prv_sec"], ["Mutual funds", "ofc_prv_mf"], ["Private, other", "ofc_prv_oth"]];
    return slide({
      id: "ofc", lead: "Other financial institutions:",
      claim: (at(funder.net, i) < 0 ? `${funder.name.toLowerCase()} place a net ${idr(at(funder.net, i))} with banks` : `no group is a net depositor`) +
        (at(borrower.net, i) > 0 ? `, while ${borrower.name.toLowerCase()} borrow a net ${idr(at(borrower.net, i))}` : ""),
      bullets: [
        `Non-bank financial institutions hold <b>${idr(at(dep, i))}</b> of deposits (${spct(growthAt(dep, i))} in a year) and owe <b>${idr(at(loans, i))}</b> in loans (${spct(growthAt(loans, i))}).`,
        `State-owned institutions hold ${pct(100 * at(S("dep.total.ofc_pub"), i) / at(dep, i), 0)} of those deposits and ${pct(100 * at(S("loans.total.ofc_pub"), i) / at(loans, i), 0)} of the loans.`,
        `Counting banks' holdings of their securities (${idr(at(S("i3.other_ofc"), i))}) and non-deposit funding from them (${idr(at(S("i3.liab_ofc"), i))}), the net position on the sector is <b>${stn(at(P.net.ofc, i))} tn</b>.`,
      ],
      panels:
        panel({ cap: "Deposits at banks (left) and loans from banks (right), by type of institution", unit: "IDR tn",
          draw: el => Charts.pair(el, { fmt: fT, leftName: "Deposits", rightName: "Loans", leftColor: BLUE, rightColor: RED,
            items: detail.map(([label, nd]) => ({ label, left: at(S("dep.total." + nd), i), right: at(S("loans.total." + nd), i) })) }) }) +
        lines("Loans minus deposits, by type of institution", "IDR tn; below zero = the group funds banks",
          g.map(t => L(t.name, t.net, t.color)), { fmt: stn, axisFmt: fT, baseline: true, height: 300 }),
      source: "Bank Indonesia (SEKI tables I.3, I.11, I.18)",
    });
  }

  function currency(i, P) {
    const dom = ["lg", "ofc", "soe", "firms", "indiv"];
    const node = { lg: ["lg"], ofc: ["ofc"], soe: ["soe"], firms: ["firms"], indiv: ["indiv"], rest: ["found", "coop", "oth"] };
    const gapOf = (ccy, id) => sub(add(...node[id].map(nd => S(`loans.${ccy}.${nd}`))), add(...node[id].map(nd => S(`dep.${ccy}.${nd}`))));
    const ids = dom.concat(["rest"]);
    const fxGap = sub(S("loans.fx.total"), S("dep.fx.total"));
    const fxLoans = ratio(S("loans.fx.total"), S("loans.total.total")), fxDep = ratio(S("dep.fx.total"), S("dep.total.total"));
    const items = ccy => ids.map(id => ({ label: byId[id].name, short: byId[id].short, value: at(gapOf(ccy, id), i), color: byId[id].color }));
    const fxItems = items("fx"), big = fxItems.slice().sort((a, b) => a.value - b.value)[0];
    const g = at(fxGap, i);
    return slide({
      id: "fx", lead: "Rupiah and foreign currency:",
      claim: g < 0 ? `residents hold ${idr(g)} more in foreign-currency deposits than they owe in foreign-currency loans`
        : `residents owe ${idr(g)} more in foreign-currency loans than they hold in foreign-currency deposits`,
      bullets: [
        `Foreign-currency loans to residents are <b>${idr(at(S("loans.fx.total"), i))}</b> (${pct(at(fxLoans, i))} of loans); foreign-currency deposits are <b>${idr(at(S("dep.fx.total"), i))}</b> (${pct(at(fxDep, i))} of deposits).`,
        big.value < 0 ? `<b>${big.label}</b> hold the largest surplus of foreign-currency deposits over loans: ${idr(big.value)}.` : null,
        `A year earlier the shares were ${pct(at(fxLoans, i - 12))} of loans and ${pct(at(fxDep, i - 12))} of deposits.`,
        `For comparison, banks' net position on non-residents is ${stn(at(P.net.nr, i))} tn.`,
        `Loans and deposits only: BI does not split banks' securities holdings by currency. Amounts are in rupiah, so they move with the exchange rate.`,
      ],
      panels:
        panel({ cap: "Foreign currency: loans minus deposits by sector", unit: "IDR tn; left of zero = more deposits than loans",
          draw: el => Charts.hbar(el, { fmt: stn, valueName: "FX loans minus FX deposits, IDR tn", items: fxItems }) }) +
        panel({ cap: "Rupiah: loans minus deposits by sector", unit: "IDR tn",
          draw: el => Charts.hbar(el, { fmt: stn, valueName: "Rupiah loans minus deposits, IDR tn", items: items("rupiah") }) }) +
        lines("Foreign-currency share of residents' loans and deposits", "% of the total",
          [L("Loans", fxLoans, RED), L("Deposits", fxDep, BLUE)], { fmt: fP, axisFmt: fP0 }) +
        lines("Residents' foreign-currency loans minus deposits, and banks' net position on non-residents", "IDR tn",
          [L("FX loans minus FX deposits (residents)", fxGap, AMBER), L("Net position on non-residents", P.net.nr, INK)], { fmt: stn, axisFmt: fT, baseline: true }),
      source: "Bank Indonesia (SEKI tables I.3, I.11, I.18)",
    });
  }

  function fundingMix(i) {
    const t = k => S(`bg.dep.total.all.${k}`), all = t("all");
    const casa = ratio(add(t("giro"), t("sav")), all);
    const casaOf = id => ratio(add(S(`bg.dep.total.${id}.giro`), S(`bg.dep.total.${id}.sav`)), S(`bg.dep.total.${id}.all`));
    const fxOf = id => ratio(S(`bg.dep.fx.${id}.all`), S(`bg.dep.total.${id}.all`));
    const four = BANKS.filter(b => b.id !== "rural");
    const now = four.map(b => ({ b, v: at(casaOf(b.id), i) })).sort((a, c) => c.v - a.v);
    const types = [L("Demand deposits", t("giro"), RED), L("Savings deposits", t("sav"), SALMON), L("Time deposits", t("time"), BLUE)];
    const d = change(casa, i, 12);
    return slide({
      id: "mix", lead: "Funding mix:",
      claim: `current and savings accounts are ${pct(at(casa, i))} of deposits, ${word(d, "up", "down")} ${pts(Math.abs(d)).replace("+", "")} in a year`,
      bullets: [
        `Deposits total <b>${idr(at(all, i))}</b>: demand ${idr(at(t("giro"), i))}, savings ${idr(at(t("sav"), i))}, time ${idr(at(t("time"), i))}.`,
        `Growth over 12 months: demand ${spct(growthAt(t("giro"), i))}, savings ${spct(growthAt(t("sav"), i))}, time ${spct(growthAt(t("time"), i))}.`,
        `<b>${now[0].b.name}</b> banks have the highest share of current and savings accounts (${pct(now[0].v, 0)}), <b>${now[now.length - 1].b.name.toLowerCase()}</b> banks the lowest (${pct(now[now.length - 1].v, 0)}).`,
        `Dashed lines mark months where banks changed group; see the Bank groups page.`,
      ],
      panels:
        panel({ cap: "Deposits by type", unit: "% of deposits", legend: types.map(s => ({ name: s.name, color: s.color })),
          draw: el => Charts.stack(el, { ...win(), series: types, fmt: fT, axisFmt: fP0, percent: true, height: 240 }) }) +
        lines("Current and savings accounts as a share of deposits, by bank group", "% of the group's deposits",
          four.map(b => L(b.name, casaOf(b.id), b.color)), { fmt: fP0, axisFmt: fP0, marks: marks(), height: 240 }) +
        lines("Growth over 12 months by type of deposit", "% change on a year earlier",
          types.map(s => L(s.name, growth(s.values), s.color)), { fmt: fP, axisFmt: fP0, baseline: true }) +
        lines("Foreign-currency share of deposits, by bank group", "% of the group's deposits",
          four.map(b => L(b.name, fxOf(b.id), b.color)), { fmt: fP0, axisFmt: fP0, marks: marks() }),
      source: "Bank Indonesia (SEKI table I.17)",
    });
  }

  function bankGroups(i) {
    const loans = id => S(`bg.loans.${id}`), dep = id => S(`bg.dep.total.${id}.all`);
    const ldr = id => ratio(loans(id), dep(id)), gap = id => sub(loans(id), dep(id));
    const now = BANKS.map(b => ({ b, ldr: at(ldr(b.id), i), gap: at(gap(b.id), i), loans: at(loans(b.id), i), dep: at(dep(b.id), i) })).filter(r => r.ldr != null);
    if (!now.length) {
      return slide({ id: "groups", lead: "Bank groups:", claim: "loans by bank group start in June 2016", panels: `<div class="empty">Choose a later as-of month to see this page.</div>`, source: "Bank Indonesia (SEKI tables I.4, I.17)" });
    }
    const sorted = now.slice().sort((a, c) => c.ldr - a.ldr), totL = at(loans("all"), i);
    const names = { persero: "state-owned", private: "private national", bpd: "regional (BPD)", foreign: "foreign", rural: "rural" };
    const breakNote = D.breaks.map(b => {
      const j = dates.indexOf(b.date), f = k => stn(b.loans[k]), g = k => stn(b.deposits[k]);
      return b.detected
        ? `<b>${monthLong(j)} (seen in the data, not stated in BI's tables):</b> loans of state-owned banks ${f("persero")} and of private national banks ${f("private")} in one month; deposits ${g("persero")} and ${g("private")}. This looks like a bank changing group.`
        : `<b>${monthLong(j)} (BI's regrouping):</b> joint-venture banks moved from the foreign group to private national banks, shifting ${idr(b.loans.private)} of loans and ${idr(b.deposits.private)} of deposits.`;
    }).join(" ");
    const rows = now.map(r => ({ cells: [{ html: `<span class="sw" style="background:${r.b.color}"></span>${r.b.name}` }, tn(r.loans), pct(100 * r.loans / totL, 0), tn(r.dep), signed(r.gap), pct(r.ldr, 0)] }));
    rows.push({ cls: "total", cells: ["All banks", tn(totL), "100%", tn(at(dep("all"), i)), signed(totL - at(dep("all"), i)), pct(100 * totL / at(dep("all"), i), 0)] });
    const p = now.find(r => r.b.id === "persero");
    return slide({
      id: "groups", lead: "Bank groups:",
      claim: `${names[sorted[0].b.id]} banks lend the most against their deposits (${pct(sorted[0].ldr, 0)}), ${names[sorted[sorted.length - 1].b.id]} banks the least (${pct(sorted[sorted.length - 1].ldr, 0)})`,
      strap: breakNote + " Growth rates and shares across these months are not like for like.",
      bullets: [
        p ? `State-owned banks hold <b>${pct(100 * p.loans / totL, 0)}</b> of loans and ${pct(100 * p.dep / at(dep("all"), i), 0)} of deposits; they lend ${pct(p.ldr, 0)} of what they collect.` : null,
        `Across all banks, loans are ${pct(100 * totL / at(dep("all"), i), 0)} of deposits: ${idr(Math.abs(totL - at(dep("all"), i)))} ${totL < at(dep("all"), i) ? "of deposits is not lent out and sits in securities, at BI or abroad" : "of lending is funded from other sources"}.`,
        `Loans by bank group start in June 2016 in BI's current table; deposits go back to 2010.`,
      ],
      panels:
        lines("Loans as a share of deposits, by bank group", "loans as % of deposits",
          BANKS.map(b => L(b.name, ldr(b.id), b.color)), { fmt: fP0, axisFmt: fP0, marks: marks(), height: 250 }) +
        lines("Loans minus deposits, by bank group", "IDR tn; below zero = more deposits than loans",
          BANKS.map(b => L(b.name, gap(b.id), b.color)), { fmt: stn, axisFmt: fT, baseline: true, marks: marks(), height: 250 }) +
        panel({ cap: "Share of all bank loans, by bank group", unit: "% of loans", legend: BANKS.map(b => ({ name: b.name, color: b.color })),
          draw: el => Charts.stack(el, { ...win(), series: BANKS.map(b => L(b.name, loans(b.id), b.color)), fmt: fT, axisFmt: fP0, percent: true, marks: marks(), height: 230 }) }) +
        tablePanel(`Bank groups in ${monthShort(i)}`, "IDR tn", ["Group", "Loans", "Share", "Deposits", "Loans minus deposits", "Loans / deposits"], rows),
      source: "Bank Indonesia (SEKI tables I.4, I.17)",
    });
  }

  function checksPage(i) {
    const c = D.checks, flagged = c.flagged.length, total = sum(c.summary.map(r => r.months));
    const m = s => (s ? monthShort(dates.indexOf(s)) : "");
    const rows = c.summary.map(r => ({ cells: [r.check, String(r.months), r.flagged ? { html: String(r.flagged), cls: "pos" } : "0", m(r.first), m(r.last),
      r.max_gap_pct == null ? "" : pct(r.max_gap_pct, 2), r.max_gap == null ? "" : tn(r.max_gap, 1)] }));
    const sc = selfcheck;
    const defs = [
      ["Net position", "Banks' claims on a sector minus banks' liabilities to it. Positive: banks are net lenders to the sector. Negative: the sector funds banks."],
      ["Banks", "Commercial and rural banks together, as in BI's analytical balance sheet (table I.3)."],
      ["Bank Indonesia, central government, non-residents", "Both sides from table I.3."],
      ["Local governments, other financial institutions, SOEs", "Claims (loans plus securities and other claims) from I.3; deposits from I.18. For other financial institutions, I.3's non-deposit liabilities are added."],
      ["Private firms and individuals", "Loans from I.11 and deposits from I.18. Banks' non-loan claims on the private sector come from I.3 and are split by the \"Securities to firms\" setting, the model's one assumption."],
      ["Capital and other items", "The balancing line: minus the sum of the nine counterparts. It equals banks' equity plus net other items in I.3, plus small differences between BI's tables."],
      ["Bank groups", "Deposits from I.17 (from 2010) and loans from I.4 (from June 2016). Where a history sheet and the current sheet overlap, the current sheet is used."],
      ["Provisional months", `BI marks the latest month of I.3 with an asterisk. Provisional now: ${D.meta.provisional.map(s => monthShort(dates.indexOf(s))).join(", ") || "none"}.`],
      ["Blank foreign-currency cells", "Where BI leaves a foreign-currency cell blank it is taken as total minus rupiah."],
      ["Not covered", "Interest rates, provincial splits, loans by economic sector and history before 2010 (BI's earlier sheets use other sector definitions)."],
    ];
    return slide({
      id: "checks", lead: "Checks and method:",
      claim: `${flagged} of ${total.toLocaleString("en-US")} comparisons between BI's tables are flagged; none is corrected`,
      strap: `The page recomputes every net position from the raw series. <span class="badge ${sc.ok ? "" : "bad"}">${sc.ok ? "Self-check passed" : "Self-check failed"}</span> ` +
        `Largest difference from the build script's own figures: IDR ${sc.worst.toFixed(2)} bn across all ${N} months.` +
        (D.meta.left_out ? ` ${esc(D.meta.left_out)}` : ""),
      panelsCls: "panels one",
      panels:
        tablePanel("Reconciliations between BI's tables, every month since 2010",
          `Table comparisons and the I.3 identity are flagged above ${c.tolerance_pct}% of the reference; the zero-sum and balancing-line checks above IDR 1 bn`,
          ["Check", "Months", "Flagged", "First flagged", "Last flagged", "Largest gap", "Largest gap, IDR tn"], rows) +
        `<figure class="panel"><figcaption class="cap">Definitions</figcaption><div class="unit"></div><div class="defs">${defs.map(d => `<p><b>${d[0]}.</b> ${d[1]}</p>`).join("")}</div></figure>`,
      source: `Bank Indonesia (SEKI tables I.3, I.4, I.11, I.17, I.18), downloaded ${D.meta.snapshot}`,
    });
  }

  // ---- explorer ---------------------------------------------------------------
  const X_COLORS = [RED, BLUE, NAVY, AMBER, GREY, DARK, SALMON, SKY];
  function catalog() {
    const computed = [];
    [["net", "Net position"], ["claims", "Banks' claims"], ["liab", "Banks' liabilities"]].forEach(([kind, label]) => {
      SECTORS.forEach(s => { if (kind === "net" || !s.balancing) computed.push({ key: `${kind}.${s.id}`, label: `${label}: ${s.name}`, group: "Sector positions (computed)" }); });
    });
    return computed.concat(D.catalog);
  }
  function valuesOf(key) {
    const [kind, id] = key.split(".");
    if (["net", "claims", "liab"].includes(kind) && byId[id]) return positions()[kind][id];
    return S(key);
  }
  const MODES = { level: ["Level", "IDR tn"], d12: ["Change over 12 months", "IDR tn"], d1: ["Change over 1 month", "IDR tn"], g12: ["Growth over 12 months", "%"] };
  const transform = (arr, mode) => (mode === "d12" ? diff(arr, 12) : mode === "d1" ? diff(arr, 1) : mode === "g12" ? growth(arr) : arr);

  function explorerPage() {
    const cat = catalog(), byKey = Object.fromEntries(cat.map(c => [c.key, c]));
    explorer.keys = explorer.keys.filter(k => byKey[k]);
    const series = explorer.keys.map((k, n) => L(byKey[k].label, transform(valuesOf(k), explorer.mode), X_COLORS[n % X_COLORS.length]));
    const isPct = explorer.mode === "g12";
    const fmt = isPct ? fP : explorer.mode === "level" ? fT : stn;
    const chart = series.length
      ? panel({ cap: `${MODES[explorer.mode][0]} of the chosen series`, unit: MODES[explorer.mode][1], legend: leg(series),
        draw: el => Charts.line(el, { ...win(), series, fmt, axisFmt: isPct ? fP0 : fT, height: 380, baseline: explorer.mode !== "level" }) })
      : `<div class="empty">Tick up to eight series on the left.</div>`;
    return `<section class="slide" id="explorer"><h2 class="headline"><span class="lead">Explorer:</span> <span class="claim">chart any of the ${cat.length} series behind this dashboard</span></h2>` +
      `<div class="explorer"><div class="picker"><input type="search" id="x-search" placeholder="Search series, e.g. pension, giro, Persero" value="${esc(explorer.query)}" aria-label="Search series">` +
      `<div class="list" id="x-list"></div></div><div><div class="xbar"><label class="ctl">Show <select id="x-mode">` +
      Object.entries(MODES).map(([k, v]) => `<option value="${k}" ${k === explorer.mode ? "selected" : ""}>${v[0]}</option>`).join("") + `</select></label>` +
      `<button class="btn" id="x-csv" type="button">Download chosen series (CSV)</button><button class="btn ghost" id="x-all" type="button">Download everything (CSV)</button>` +
      `<button class="btn ghost" id="x-clear" type="button">Clear</button></div><div class="panels one">${chart}</div></div></div>` +
      `<p class="source"><b>Source:</b> Bank Indonesia (SEKI tables I.3, I.4, I.11, I.17, I.18). CSV files are in IDR billion.</p><span class="pageno">${PAGES.length}</span></section>`;
  }
  function fillPicker() {
    const list = document.getElementById("x-list");
    if (!list) return;
    const q = explorer.query.trim().toLowerCase(), cat = catalog();
    let html = "", group = null, shown = 0;
    cat.forEach(c => {
      if (q && !c.label.toLowerCase().includes(q) && !c.group.toLowerCase().includes(q)) return;
      if (c.group !== group) { group = c.group; html += `<div class="grp">${esc(group)}</div>`; }
      html += `<label><input type="checkbox" value="${esc(c.key)}" ${explorer.keys.includes(c.key) ? "checked" : ""}>${esc(c.label)}</label>`;
      shown += 1;
    });
    list.innerHTML = shown ? html : `<div class="empty">Nothing matches "${esc(explorer.query)}"</div>`;
  }
  function download(name, keys) {
    const cat = Object.fromEntries(catalog().map(c => [c.key, c]));
    const cell = s => `"${String(s).replace(/"/g, '""')}"`;
    const cols = keys.map(k => valuesOf(k));
    const rows = [["month"].concat(keys.map(k => cell(cat[k].label + " (IDR bn)"))).join(",")];
    dates.forEach((dt, r) => rows.push([dt].concat(cols.map(c => (c[r] == null ? "" : Math.round(c[r] * 10) / 10))).join(",")));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([rows.join("\n")], { type: "text/csv" }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function wireExplorer() {
    fillPicker();
    const search = document.getElementById("x-search");
    search.addEventListener("input", () => { explorer.query = search.value; fillPicker(); });
    document.getElementById("x-list").addEventListener("change", evt => {
      const key = evt.target.value;
      if (evt.target.checked) {
        if (explorer.keys.length >= 8) { evt.target.checked = false; return; }
        explorer.keys.push(key);
      } else explorer.keys = explorer.keys.filter(k => k !== key);
      render();
    });
    document.getElementById("x-mode").addEventListener("change", evt => { explorer.mode = evt.target.value; render(); });
    document.getElementById("x-clear").addEventListener("click", () => { explorer.keys = []; render(); });
    document.getElementById("x-csv").addEventListener("click", () => { if (explorer.keys.length) download("net_bank_balance_selection.csv", explorer.keys); });
    document.getElementById("x-all").addEventListener("click", () => download("net_bank_balance_all_series.csv", catalog().map(c => c.key)));
  }

  // ---- render and controls ----------------------------------------------------
  function render() {
    const keepY = window.scrollY, i = state.asOf, P = positions();
    draws = []; seq = 0;
    app.innerHTML = [cover(i), glance(i, P), overTime(i, P), bothSides(i, P), bankIndonesia(i, P), government(i, P), nonResidents(i, P),
      firmsPage(i, P), households(i, P), otherFinancials(i, P), currency(i, P), fundingMix(i), bankGroups(i), checksPage(i), explorerPage()].join("");
    draws.forEach(fn => fn());
    wireExplorer();
    window.scrollTo(0, keepY);
    spy();
  }

  function spy() {
    const mid = window.innerHeight * 0.35;
    let current = null;
    PAGES.forEach(([id]) => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < mid) current = id; });
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.page === current));
  }

  function init() {
    selfcheck = NBB.selfCheck();
    if (!selfcheck.ok) console.error("Net bank balance self-check failed", selfcheck);
    document.getElementById("nav").innerHTML = PAGES.map(([id, name]) => `<a href="#${id}" data-page="${id}">${name}</a>`).join("");
    const asof = document.getElementById("ctl-asof");
    asof.innerHTML = d3.range(N - 1, 11, -1).map(j => `<option value="${j}">${monthShort(j)}${isProvisional(j) ? " (provisional)" : ""}</option>`).join("");
    asof.value = String(state.asOf);
    asof.addEventListener("change", () => { state.asOf = Number(asof.value); render(); });
    const range = document.getElementById("ctl-range");
    const press = () => range.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.range === String(state.range))));
    range.addEventListener("click", evt => { const b = evt.target.closest("button"); if (!b) return; state.range = b.dataset.range; press(); render(); });
    press();
    const share = document.getElementById("ctl-share"), out = document.getElementById("ctl-share-out");
    share.value = String(Math.round(state.share * 100));
    out.textContent = share.value + "%";
    share.addEventListener("input", () => { state.share = Number(share.value) / 100; out.textContent = share.value + "%"; render(); });
    let timer = null, lastW = window.innerWidth;
    window.addEventListener("resize", () => {
      if (window.innerWidth === lastW) return;
      lastW = window.innerWidth;
      clearTimeout(timer);
      timer = setTimeout(render, 150);
    });
    window.addEventListener("scroll", () => { Charts.Tip.hide(); spy(); }, { passive: true });
    window.addEventListener("beforeprint", render);
    render();
  }

  init();
  return { render, state, selfcheck: () => selfcheck };
})();

</script>
</body>
</html>
